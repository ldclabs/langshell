[package]
name = "langshell-monty"
description = "Monty-backed LangShell runtime with persistent sessions, validation, and snapshots."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/langshell-monty"
keywords = ["ai", "agents", "sandbox", "python", "monty"]
categories = ["asynchronous", "development-tools"]

[dependencies]
langshell-core = { path = "../langshell-core", version = "0.2" }
ciborium = { workspace = true }
futures = { workspace = true }
ic_auth_types = { workspace = true }
monty = { git = "https://github.com/pydantic/monty.git", tag = "v0.0.17" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff.git", package = "ruff_python_ast", rev = "6ded4bed1651e30b34dd04cdaa50c763036abb0d" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff.git", package = "ruff_python_parser", rev = "6ded4bed1651e30b34dd04cdaa50c763036abb0d" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
langshell = { path = "../langshell", version = "0.2" }
